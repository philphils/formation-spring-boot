spring.application.name=formation-spring-boot-project
app.name=Formation Spring Boot
app.version=1.0.0
app.environment=DEFAULT

logging.level.root=WARN

spring.datasource.url=jdbc:h2:mem:defaultdb
spring.datasource.username=sa
spring.datasource.password=

management.endpoints.web.exposure.include=health,info,env,metrics,beans,loggers
management.endpoint.health.show-details=always
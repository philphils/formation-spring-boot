spring.application.name=formation-spring-boot-project
app.name=Formation Spring Boot
app.version=1.0.0
app.environment=DEFAULT

spring.datasource.url=jdbc:h2:mem:defaultdb
spring.datasource.username=sa
spring.datasource.password=

management.endpoints.web.exposure.include=health,info,env,metrics,beans,loggers
management.endpoint.health.show-details=always

management.info.env.enabled=true

##LOG
logging.level.root=INFO
logging.level.fr.insee.formation=DEBUG

#Info pour le endpoint actuator/info
info.app.name=Formation Spring Boot
info.app.version=1.0.0
info.app.environment=DEFAULT